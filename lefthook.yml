# Concord pre-push preflight gates (CON-893).
#
# Preflight, not full-suite proof: these gates stop an obviously broken push
# before it reaches CI. CI remains the verification owner; the full Go test
# suite, the adapter suite, the script battery, the race detector, and acceptance
# stay CI-only.
#
# Routing: a command whose glob matches none of the pushed files is skipped,
# so a documentation-only or Python-only push skips the Go gates. Lefthook's
# default matcher compiles patterns without a path separator, so a single
# `*` also crosses directory boundaries, and matching is case-insensitive
# against the repository-relative path.
#
# Admission: every gate command runs through `bin/oc-test preflight-gate`,
# which enters the host admission route (oc-test-gate's smoke admission
# lane) before running the gate. That lane is separate from the heavy lane
# full-tier suites use, so a full local suite does not block a push's gates;
# concurrent pushes from linked worktrees still queue their gate work
# instead of overlapping it, and inside a synchronous tool call a gate waits
# up to the host's default 30 s (OC_WORKLOAD_GATE_SYNC_WAIT_MS) for the lane
# before admission is refused (exit 75). On a host without oc-test-gate
# the gate still runs natively, with a warning: a normal push never loses
# a gate.
#
# `no_auto_install: true` keeps `lefthook run pre-push` (what
# `bin/oc-test preflight` executes) from touching the installed hooks.
# `assert_lefthook_installed: true` makes an installed hook fail loudly when
# the lefthook binary disappears, instead of silently running nothing.
min_version: 2.1.14
assert_lefthook_installed: true
no_auto_install: true

pre-push:
  # Serial, not parallel, within one push. Across pushes, the admission in
  # preflight-gate serializes the heavy gate work on the shared host; every
  # agent worktree runs these whole-repository Go gates on push.
  parallel: false
  commands:
    gofmt:
      glob: &go_planes
        - "*.go"
        - go.mod
        - go.sum
        - .golangci.yml
        - .github/workflows/ci.yml
        - lefthook.yml
      run: bin/oc-test preflight-gate -- bash -c 'unformatted="$(gofmt -l .)" || exit 1; printf "%s\n" "$unformatted"; test -z "$unformatted"'
    go-vet:
      glob: *go_planes
      run: bin/oc-test preflight-gate -- go vet ./...
    go-build:
      glob: *go_planes
      run: bin/oc-test preflight-gate -- go build ./...
    go-compile-tests:
      glob: *go_planes
      run: "bin/oc-test preflight-gate -- go test -run '^$' -timeout=15m ./..."
    go-lint:
      glob: *go_planes
      run: bin/oc-test preflight-gate -- go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1 run --output.text.colors=false ./...
    check-json:
      glob:
        - "contracts/*"
        - ".concord/*"
        - "adapter/*.ts"
        - "scripts/check-*.py"
        - "scripts/generate-*.py"
        - .github/workflows/ci.yml
        - lefthook.yml
      env:
        CONCORD_REQUIRE_BUN: "1"
      run: bin/oc-test preflight-gate -- python3 scripts/check-json.py --adapter-tests-external --contract-tests-external
    check-reachability:
      glob:
        - "*.go"
        - go.mod
        - go.sum
        - .github/workflows/ci.yml
        - lefthook.yml
        - scripts/check-reachability.py
        - ".concord/docs/reachability-exceptions.v1.json"
      run: bin/oc-test preflight-gate -- python3 scripts/check-reachability.py
    check-complexity:
      glob:
        - "*.go"
        - go.mod
        - go.sum
        - .github/workflows/ci.yml
        - lefthook.yml
        - scripts/check-complexity.py
      run: bin/oc-test preflight-gate -- python3 scripts/check-complexity.py
