name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  verify-lookup:
    name: select verification evidence
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      mode: ${{ steps.select.outputs.mode }}
    steps:
      - name: Check out the pushed target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select reuse or full verification
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          python3 scripts/release-evidence.py select \
            --repository "$REPOSITORY" \
            --target-sha "$TARGET_SHA" \
            --output-file "$RUNNER_TEMP/admission-receipt.json" \
            --github-output "$GITHUB_OUTPUT"
          {
            echo "### Release verification selection"
            echo
            echo '```json'
            cat "$RUNNER_TEMP/admission-receipt.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The complete fallback: the same CI workflow file, called at the job level
  # with read-only permissions and no inherited secrets. The caller's `github`
  # context (this main push) reaches the called jobs, so its event-dependent
  # assertions run against the main push base on this route.
  ci-fallback:
    name: full CI fallback
    needs: verify-lookup
    if: needs.verify-lookup.outputs.mode == 'full'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # The admission gate. `always()` makes every dependency state explicit:
  # publication requires the lookup to have succeeded AND either
  # (mode=reuse with the fallback skipped) or (mode=full with the fallback
  # succeeded). A failed, cancelled, unknown, or conflicting state refuses
  # admission, and the script's exit code - not the mode output alone - is
  # what prepare sees.
  admit-verification:
    name: admit verified merged SHA
    needs: [verify-lookup, ci-fallback]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check out the admitted target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Evaluate the admission algebra
        env:
          LOOKUP_RESULT: ${{ needs.verify-lookup.result }}
          MODE: ${{ needs.verify-lookup.outputs.mode }}
          FALLBACK_RESULT: ${{ needs.ci-fallback.result }}
        run: python3 scripts/release-evidence.py gate --mode "$MODE" --lookup-result "$LOOKUP_RESULT" --fallback-result "$FALLBACK_RESULT"

  # The reuse route skips the fallback. Explicit status checks keep that skip
  # from suppressing admitted publication; cancellation and actual dependency
  # results still refuse it.
  prepare:
    name: compute release
    needs: admit-verification
    if: ${{ !cancelled() && needs.admit-verification.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out merged tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Compute version and release notes
        id: release
        run: python3 scripts/release.py --output-dir release --github-output "$GITHUB_OUTPUT"

  build-and-publish:
    name: build and publish release
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out merged tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Recompute release metadata
        id: release
        run: python3 scripts/release.py --output-dir release --github-output "$GITHUB_OUTPUT"
      - name: Build Linux amd64 binary
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          test -n "$VERSION"
          test "$VERSION" = "${{ needs.prepare.outputs.version }}"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          mkdir -p release
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build \
            -trimpath -buildvcs=false \
            -ldflags "-X github.com/sharper-flow/concord/internal/version.Value=$VERSION" \
            -o "release/concord-$VERSION" ./cmd/concord
          mkdir -p release/package/bin release/package/adapter/opencode release/package/skills release/package/instructions release/package/agents
          cp "release/concord-$VERSION" release/package/bin/concord
          # The installer decides which adapter files a release must contain, so
          # the packing step reads that set rather than restating it. A literal
          # list here can fall behind ADAPTER_FILES and produce an archive the
          # installer refuses, which is how v1.0.0 through v1.1.1 shipped
          # without credentials.ts.
          python3 -c 'import sys; sys.path.insert(0, "scripts"); import install; print("\n".join(install.ADAPTER_FILES))' > release/adapter-files.txt
          test -s release/adapter-files.txt
          while read -r adapter_name; do
            test -n "$adapter_name"
            cp "adapter/opencode/$adapter_name" release/package/adapter/opencode/
          done < release/adapter-files.txt
          cp -a skills/. release/package/skills/
          cp -a .concord/instructions/. release/package/instructions/
          cp .opencode/agents/[Cc]oncord*.md release/package/agents/
          cp scripts/install.py release/concord-installer.py
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -C release/package -cf - bin adapter skills instructions agents | gzip -n > "release/concord-$VERSION.tar.gz"
      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          file: release/concord-${{ steps.release.outputs.version }}.tar.gz
          format: spdx-json
          output-file: release/concord-${{ steps.release.outputs.version }}.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Verify release artifacts
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          test "$(./release/concord-$VERSION --version)" = "$VERSION"
          mkdir -p release/upload
          cp "release/concord-$VERSION" "release/upload/concord-$VERSION"
          cp "release/concord-$VERSION.tar.gz" "release/upload/concord-$VERSION.tar.gz"
          cp "release/concord-$VERSION.sbom.spdx.json" "release/upload/concord-$VERSION.sbom.spdx.json"
          cp release/concord-installer.py release/upload/concord-installer.py
          cp release/CHANGELOG.md release/upload/CHANGELOG.md
          cd release/upload
          mapfile -t assets < <(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          test "${#assets[@]}" -gt 0
          sha256sum "${assets[@]}" > "concord-$VERSION.sha256"
          mapfile -t checksummed < <(awk '{print $2}' "concord-$VERSION.sha256" | sort)
          diff -u <(printf '%s\n' "${assets[@]}") <(printf '%s\n' "${checksummed[@]}")
          echo "Every uploaded release asset is present in the checksum manifest."
          sha256sum --check "concord-$VERSION.sha256"
      - name: Verify the archive carries every file the installer requires
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          # Publishing an archive the installer refuses is the failure this step
          # exists to make impossible. scripts/test-installer.py cannot catch it:
          # it builds its fixture archive from installer.ADAPTER_FILES, so its
          # input agrees with the installer by construction and the packing step
          # is never consulted. This checks the real archive instead.
          #
          # A full `install` is not run here. Preflight requires secret-tool,
          # gnome-keyring-daemon and a live Secret Service, which a runner does
          # not have; test-installer.py only clears it by stubbing those onto
          # PATH. Stubbing them here would test the stubs, so this asserts the
          # archive's contents, which is the property that actually broke.
          python3 - "release/upload/concord-$VERSION.tar.gz" <<'PY'
          import sys, tarfile
          from pathlib import Path
          sys.path.insert(0, "scripts")
          import install

          archive = sys.argv[1]
          with tarfile.open(archive) as bundle:
              present = set(bundle.getnames())

          required = {"bin/concord"}
          required |= {f"adapter/opencode/{name}" for name in install.ADAPTER_FILES}
          required |= {f"instructions/{name}" for name in install.INSTRUCTION_FILES}
          required |= {f"agents/{name}" for name in install.AGENT_FILES}
          required |= {path.as_posix() for path in Path("skills").rglob("*") if path.is_file()}
          missing = sorted(required - present)
          if missing:
              raise SystemExit(
                  f"{archive} omits files the installer requires: {', '.join(missing)}"
              )
          print(f"{archive} carries every installer-required file: {', '.join(sorted(required))}")
          PY
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-checksums: release/upload/concord-${{ steps.release.outputs.version }}.sha256
      - name: Create annotated release tag
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse --verify --quiet "refs/tags/$VERSION" >/dev/null; then
            tagged="$(git rev-parse "$VERSION^{commit}")"
            if [ "$tagged" != "${{ github.sha }}" ]; then
              echo "::error::tag $VERSION exists at $tagged but this run is for ${{ github.sha }}"
              exit 1
            fi
            echo "tag $VERSION already points at $tagged; nothing to push"
          else
            git tag --annotate "$VERSION" "${{ github.sha }}" --message "Release $VERSION"
            git push origin "$VERSION"
          fi
      - name: Reconcile an existing release for this version
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          # A publish that fails partway leaves a draft holding some of the
          # assets. A draft is not addressable by tag, so the publish step
          # cannot find that draft and adds a second one on every retry, which
          # is how v8.28.0, v8.28.5, v9.0.0 and v9.0.1 accumulated. Delete the
          # partial draft here, and report a release that already published so
          # the publish step stays a no-op when a completed release is rerun.
          for id in $(gh api --paginate "repos/$REPOSITORY/releases" \
            --jq '.[] | select(.draft and .tag_name == env.VERSION) | .id'); do
            echo "Deleting partial draft release $id for $VERSION."
            gh api --method DELETE "repos/$REPOSITORY/releases/$id"
          done
          published="$(gh api --paginate "repos/$REPOSITORY/releases" \
            --jq '.[] | select((.draft | not) and .tag_name == env.VERSION) | .id' | wc -l | tr -d ' ')"
          echo "published=$published" >> "$GITHUB_OUTPUT"
      - name: Decide whether this publish holds the Latest flag
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          # GitHub's API defaults make_latest to true, forcing Latest onto
          # every newly published release. A run that publishes an older
          # version after a newer one must not take the flag: that default is
          # how v8.0.2 held Latest over v8.1.0 on 2026-09-09 while the
          # installer follows /releases/latest for default installs.
          gh api --paginate "repos/$REPOSITORY/releases" \
            --jq '.[] | select((.draft | not) and (.prerelease | not)) | .tag_name' \
            > "$RUNNER_TEMP/published-tags.txt"
          python3 - "$VERSION" "$RUNNER_TEMP/published-tags.txt" "$RUNNER_TEMP/make-latest.txt" <<'PY'
          import sys

          sys.path.insert(0, "scripts")
          import release

          version, tags_path, decision_path = sys.argv[1:4]
          with open(tags_path, encoding="utf-8") as stream:
              published = [line.strip() for line in stream if line.strip()]
          holds = release.publish_holds_latest(version, published)
          with open(decision_path, "w", encoding="utf-8") as stream:
              stream.write("true\n" if holds else "false\n")
          print(f"publishing {version} against published {published}: make_latest={holds}")
          PY
          decision="$(tr -d '\n' < "$RUNNER_TEMP/make-latest.txt")"
          test "$decision" = true || test "$decision" = false
          echo "make_latest=$decision" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        if: steps.existing.outputs.published == '0'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.release.outputs.version }}
          name: Concord ${{ steps.release.outputs.version }}
          body_path: release/upload/CHANGELOG.md
          # Six assets uploaded concurrently is what the GitHub asset API failed
          # on across four runs, with "Error saving asset", "Error creating
          # asset temp dir" and "Error uploading". Sequential uploads remove
          # that concurrency.
          preserve_order: true
          files: release/upload/*
          # Computed against existing published releases: an older version
          # publishing after a newer one leaves Latest on the highest.
          make_latest: ${{ steps.latest.outputs.make_latest }}
      - name: Assert Latest names the highest published version
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api --paginate "repos/$REPOSITORY/releases" \
            --jq '.[] | select((.draft | not) and (.prerelease | not)) | .tag_name' \
            > "$RUNNER_TEMP/published-tags.txt"
          gh api "repos/$REPOSITORY/releases/latest" --jq .tag_name > "$RUNNER_TEMP/latest-tag.txt"
          python3 - "$RUNNER_TEMP/published-tags.txt" "$RUNNER_TEMP/latest-tag.txt" <<'PY'
          import sys

          sys.path.insert(0, "scripts")
          import release

          tags_path, latest_path = sys.argv[1:3]
          with open(tags_path, encoding="utf-8") as stream:
              published = [line.strip() for line in stream if line.strip()]
          with open(latest_path, encoding="utf-8") as stream:
              latest_tag = stream.read().strip()
          expected = release.highest_release_tag(published)
          if latest_tag != expected:
              raise SystemExit(
                  f"Latest names {latest_tag} but the highest published version is "
                  f"{expected}; a default install would resolve the older release"
              )
          print(f"Latest names the highest published version: {latest_tag}")
          PY
