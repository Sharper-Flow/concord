name: Bug report
description: Report a reproducible defect in Concord
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please avoid including credentials or private data. Report security vulnerabilities through SECURITY.md instead.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give the smallest reproducible steps and expected behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
