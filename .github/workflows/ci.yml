name: CI

on:
  pull_request:
  # A merge queue validates each pull request against the latest main plus the
  # entries ahead of it, on a temporary `gh-readonly-queue/**` ref. The
  # verify* checks below are required, and a merge group that never reports
  # one cannot merge, so this trigger is what lets the queue replace the
  # up-to-date requirement. The jobs run in parallel; wall time is the
  # slowest job, not the sum of every step.
  merge_group:
  # The Release workflow calls this same workflow as its full verification
  # fallback, so this file stays the one owner of the verification commands
  # and no unconditional main-push CI run duplicates the queue run that
  # Release admits by exact SHA.
  workflow_call:

permissions:
  contents: read

concurrency:
  # A pull_request run groups by ref, so a new push to the branch supersedes
  # the previous run and releases its runner slots. Every other event gets a
  # group unique to the run. GitHub cancels an existing *pending* run when a
  # newer run joins the same group, and that happens with
  # `cancel-in-progress: false`, so a shared group would let one run cancel
  # another's queued work: a cancelled merge_group run breaks the queue, and
  # a run that the Release workflow calls shares the caller's `github`
  # context, so it must never join the caller's `release-main` group either.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-history:
    name: verify-history
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository and historical baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: 0.11.26
          enable-cache: "false"
      - name: Warm the uv fixture cache from the committed lock
        # The only networked uv step. Both commands refuse a lock that no
        # longer matches its project, and the sync checks every wheel
        # against the lock's hashes. The store tests copy this cache into
        # private scratch and run uv offline, so the cache is made read-only.
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/native-target-uv-cache
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/native-target-uv-venv
          UV_PYTHON_DOWNLOADS: never
        run: |
          uv lock --no-config --locked --refresh --python python3 --project internal/store/testdata/native-target-uv
          uv sync --no-config --locked --no-build --python python3 --project internal/store/testdata/native-target-uv
          chmod -R a-w "$UV_CACHE_DIR"
      - name: Replay historical failures and current regressions
        env:
          OC_NATIVE_UV_CACHE: ${{ runner.temp }}/native-target-uv-cache
          UV_OFFLINE: "1"
          UV_PYTHON_DOWNLOADS: never
        run: python3 scripts/test-workflow-history.py --output-dir "$RUNNER_TEMP/workflow-history"
      - name: Restore write access to the uv fixture cache
        if: always()
        run: if [ -d "$RUNNER_TEMP/native-target-uv-cache" ]; then chmod -R u+w "$RUNNER_TEMP/native-target-uv-cache"; fi
      - name: Retain baseline and current execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: workflow-history-${{ github.run_attempt }}
          path: ${{ runner.temp }}/workflow-history
          if-no-files-found: error
          retention-days: 90

  # Keep the required check name while independent owners run in parallel.
  # always() makes a failed, cancelled, or skipped owner fail this gate rather
  # than leave the required check skipped.
  verify:
    name: verify
    needs: [verify-history, verify-contracts, verify-adapter, verify-tooling]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification owner to pass
        env:
          HISTORY_RESULT: ${{ needs.verify-history.result }}
          CONTRACTS_RESULT: ${{ needs.verify-contracts.result }}
          ADAPTER_RESULT: ${{ needs.verify-adapter.result }}
          TOOLING_RESULT: ${{ needs.verify-tooling.result }}
        run: |
          test "$HISTORY_RESULT" = success
          test "$CONTRACTS_RESULT" = success
          test "$ADAPTER_RESULT" = success
          test "$TOOLING_RESULT" = success

  verify-adapter:
    name: verify-adapter
    needs: [verify-adapter-rest, verify-adapter-dispatch]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every adapter shard to pass
        env:
          REST_RESULT: ${{ needs.verify-adapter-rest.result }}
          DISPATCH_RESULT: ${{ needs.verify-adapter-dispatch.result }}
        run: |
          test "$REST_RESULT" = success
          test "$DISPATCH_RESULT" = success

  # The dispatch-route journey file sets most of the adapter suite's wall time,
  # so it runs alone in verify-adapter-dispatch. Every other file, including a
  # new one, runs here without a maintained allowlist. Each job uploads its
  # per-file durations and native results so imbalance and execution can be checked.
  verify-adapter-rest:
    name: verify-adapter-rest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Test the adapter suite
        env:
          CONCORD_SELECTED_PRODUCT_ID: poison-product
          CONCORD_SELECTED_WORK_ID: poison-work
          CONCORD_PRODUCT_ID: poison-product
          CONCORD_DB_PATH: /nonexistent/poison.db
          CONCORD_SELECTED_PROJECT_ID: poison-project
          CONCORD_HOST_INSTRUCTIONS: /nonexistent/poison-instructions
          CONCORD_CLIENT_REF: poison-client
          CONCORD_SOURCE: /nonexistent/poison-source
          CONCORD_BIN: /nonexistent/poison-concord
          CONCORD_FUTURE_INPUT: poison-future
          CONCORD_TEST_SUBPROCESS: poison-no-bypass
        run: bun test adapter/opencode/ --path-ignore-patterns='adapter/opencode/dispatch_route_end_to_end.test.ts' --timings="$RUNNER_TEMP/adapter-test-timings.json" --update-timings --reporter=junit --reporter-outfile="$RUNNER_TEMP/adapter-test-results.xml"
      - name: Retain adapter file durations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: adapter-test-timings-rest
          path: ${{ runner.temp }}/adapter-test-timings.json
          if-no-files-found: error
          retention-days: 90
      - name: Retain native adapter results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: adapter-test-results-rest
          path: ${{ runner.temp }}/adapter-test-results.xml
          if-no-files-found: error
          retention-days: 90

  verify-adapter-dispatch:
    name: verify-adapter-dispatch
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Test the dispatch-route journeys
        env:
          CONCORD_SELECTED_PRODUCT_ID: poison-product
          CONCORD_SELECTED_WORK_ID: poison-work
          CONCORD_PRODUCT_ID: poison-product
          CONCORD_DB_PATH: /nonexistent/poison.db
          CONCORD_SELECTED_PROJECT_ID: poison-project
          CONCORD_HOST_INSTRUCTIONS: /nonexistent/poison-instructions
          CONCORD_CLIENT_REF: poison-client
          CONCORD_SOURCE: /nonexistent/poison-source
          CONCORD_BIN: /nonexistent/poison-concord
          CONCORD_FUTURE_INPUT: poison-future
          CONCORD_TEST_SUBPROCESS: poison-no-bypass
        run: bun test ./adapter/opencode/dispatch_route_end_to_end.test.ts --timings="$RUNNER_TEMP/adapter-test-timings.json" --update-timings --reporter=junit --reporter-outfile="$RUNNER_TEMP/adapter-test-results.xml"
      - name: Retain adapter file durations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: adapter-test-timings-dispatch
          path: ${{ runner.temp }}/adapter-test-timings.json
          if-no-files-found: error
          retention-days: 90
      - name: Retain native adapter results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: adapter-test-results-dispatch
          path: ${{ runner.temp }}/adapter-test-results.xml
          if-no-files-found: error
          retention-days: 90

  # JSON owns the nested validators, builds, fixtures, and host typecheck.
  # Suite execution belongs to verify-adapter and verify-tooling instead.
  verify-contracts:
    name: verify-contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Bun
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Restore Bun package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: bun-packages-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-bun.outputs.bun-version }}-${{ hashFiles('.concord/docs/adapter-host-pin.v1.json') }}
          restore-keys: bun-packages-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-bun.outputs.bun-version }}-
      - name: Validate public content
        run: python3 scripts/check-public-content.py
      - name: Coordinator observation evaluator tests (no model calls)
        run: python3 -m unittest discover -s adapter/opencode/evals/coordinator -p 'test_*.py'
      - name: Validate documentation links
        run: python3 scripts/check-doc-links.py
      - name: Validate knowledge placement
        run: python3 scripts/check-knowledge-placement.py
      - name: Validate the frozen legislative default census
        run: python3 scripts/check-knowledge-authority-history.py
      - name: Validate agent instructions
        run: python3 scripts/check-agents-md.py
      - name: Validate primary agent examples
        run: python3 scripts/check-primary-prompts.py
      - name: Validate predecessor independence
        run: python3 scripts/check-predecessor-independence.py
      - name: Test predecessor independence
        run: python3 scripts/test-predecessor-independence.py
      - name: Test predecessor harvest
        run: python3 scripts/test-predecessor-harvest.py
      - name: Validate script test coverage
        run: python3 scripts/check-script-tests.py
      - name: Test the ci-wait wait contract (CD-0160)
        run: python3 scripts/test-ci-wait-contract.py
      - name: Validate test file naming
        run: python3 scripts/check-test-file-naming.py
      - name: Validate CD allocation
        run: |
          git fetch origin main --quiet
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --quiet
          python3 scripts/check-cd-allocation.py --no-fetch
      # Strict Bun and registry failures remain required. Only suite
      # subprocesses move to other owners, whose results verify also requires.
      - name: Validate JSON
        env:
          CONCORD_REQUIRE_BUN: "1"
        run: python3 scripts/check-json.py --adapter-tests-external --contract-tests-external
      - name: Validate the Domain registry and committed content against the change base
        env:
          CHANGE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: python3 scripts/check-domain-registry.py && python3 scripts/check-committed-content.py --base-ref "$CHANGE_BASE_REF"
      - name: Validate durable tier
        run: python3 scripts/check-durable-tier.py
      - name: Validate migration compatibility declarations
        run: python3 scripts/check-migration-compatibility.py
      - name: Test migration compatibility classifier
        run: python3 scripts/test-migration-compatibility.py
      - name: Validate predecessor operational coverage
        run: python3 scripts/check-predecessor-coverage.py
      - name: Validate relation vocabulary
        run: python3 scripts/check-relation-vocabulary.py
      - name: Validate worker scope contract
        run: python3 scripts/check-worker-scope-contract.py
      - name: Validate storage vocabulary authority
        run: python3 scripts/check-vocabulary-authority.py
      - name: Check vocabulary generators
        run: python3 scripts/generate-work-kinds.py --check && python3 scripts/generate-native-run-statuses.py --check && python3 scripts/generate-work-sizes.py --check && python3 scripts/generate-branch-freshness.py --check && python3 scripts/generate-relation-vocabulary.py --check && python3 scripts/generate-durable-tier-budget.py --check && python3 scripts/generate-lane-step-dispatch.py --check && python3 scripts/generate-conflict-rules.py --check
      - name: Validate work-item and native-run vocabularies
        run: python3 scripts/check-work-kinds.py && python3 scripts/check-native-run-statuses.py && python3 scripts/check-work-sizes.py
      - name: Validate archived-work knowledge-kind vocabulary
        run: python3 scripts/check-archived-work-kind.py
      - name: Validate rigor-class vocabulary
        run: python3 scripts/check-rigor-class.py
      - name: Validate approval consequence vocabulary
        run: python3 scripts/check-approval-consequence.py
      - name: Test native Go result artifacts
        run: python3 scripts/test-go-test-results.py
      - name: Test verification phase reporting
        run: python3 scripts/test-oc-test.py

  verify-tooling:
    name: verify-tooling
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Restore pinned Lefthook binary
        id: cache-lefthook
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/lefthook-bin
          key: lefthook-${{ runner.os }}-${{ runner.arch }}-v2.1.14-${{ hashFiles('go.mod') }}
      - name: Prepare pinned Lefthook on cache miss
        if: steps.cache-lefthook.outputs.cache-hit != 'true'
        env:
          GOBIN: ${{ runner.temp }}/lefthook-bin
        run: go install github.com/evilmartians/lefthook/v2@v2.1.14
      - name: Make prepared Lefthook available to tests
        run: echo "$RUNNER_TEMP/lefthook-bin" >> "$GITHUB_PATH"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      # CON-893: the pre-push preflight must stay identical to CI-owned
      # commands. This validator fails when a lefthook.yml gate, environment,
      # pin, selector battery, or glob routing drifts from this workflow.
      - name: Validate pre-push preflight parity
        run: python3 scripts/check-pre-push.py
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: 0.11.26
          enable-cache: "false"
      - name: Warm the uv fixture cache from the committed lock
        # The only networked uv step. Both commands refuse a lock that no
        # longer matches its project, and the sync checks every wheel
        # against the lock's hashes. The store tests copy this cache into
        # private scratch and run uv offline, so the cache is made read-only.
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/native-target-uv-cache
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/native-target-uv-venv
          UV_PYTHON_DOWNLOADS: never
        run: |
          uv lock --no-config --locked --refresh --python python3 --project internal/store/testdata/native-target-uv
          uv sync --no-config --locked --no-build --python python3 --project internal/store/testdata/native-target-uv
          chmod -R a-w "$UV_CACHE_DIR"
      - name: Validate the package-to-Domain map
        run: python3 scripts/check-package-domains.py
      - name: Test legislative reference grammar and defaults
        run: python3 scripts/test-knowledge-authority.py
      - name: Test isolated rapid integration
        run: python3 scripts/test-rapid-integration.py
      - name: Test release and installer tooling
        env:
          OC_NATIVE_UV_CACHE: ${{ runner.temp }}/native-target-uv-cache
          UV_OFFLINE: "1"
          UV_PYTHON_DOWNLOADS: never
        run: python3 scripts/test-release.py && python3 scripts/test-release-evidence.py && python3 scripts/test-installer.py && python3 scripts/test-primary-prompts.py && python3 scripts/test-commit-title.py && python3 scripts/test-predecessor-coverage.py && python3 scripts/test-floor-readiness.py && python3 scripts/test-maturity-readiness.py && python3 scripts/test-conflict-rules.py && python3 scripts/test-knowledge-index.py && python3 scripts/test-knowledge-vocabulary.py && python3 scripts/test-knowledge-closure.py && python3 scripts/test-knowledge-placement.py && python3 scripts/test-relation-vocabulary.py && python3 scripts/test-vocabulary-authority.py && python3 scripts/test-work-kinds.py && python3 scripts/test-native-run-statuses.py && python3 scripts/test-rigor-class.py && python3 scripts/test-approval-consequence.py && python3 scripts/test-archived-work-kind.py && python3 scripts/test-doc-contract.py && python3 scripts/test-agents-md.py && python3 scripts/test-agent-contracts.py && python3 scripts/test-check-json.py && python3 scripts/test-generate-law-coverage.py && python3 scripts/test-generate-knowledge-index.py && python3 scripts/test-check-domain-registry.py && python3 scripts/test-check-package-domains.py && python3 scripts/test-check-committed-content.py && python3 scripts/test-generate-agent-lanes.py && python3 scripts/test-shard-format.py && python3 scripts/test-law-coverage.py && python3 scripts/test-test-file-naming.py && python3 scripts/test-cd-allocation.py && python3 scripts/test-renumber-cd.py && python3 scripts/test-script-tests.py && python3 scripts/test-project-tooling.py && python3 scripts/test-durable-tier.py && python3 scripts/test-check-worker-scope-contract.py && python3 scripts/test-check-pr-linear-link.py && python3 scripts/test-agent-reliability-telemetry.py && python3 scripts/test-pre-push.py && python3 scripts/test-run-script-tests.py && python3 scripts/test-go-test-shard.py && python3 scripts/test-blackbox-acceptance-neighbor-mode.py && python3 scripts/test-work-sizes.py && python3 scripts/test-release-restore-population.py && python3 scripts/test-release-restore-confine.py && python3 scripts/test-release-restore-gate.py && python3 scripts/test-release-restore-invoke.py && python3 scripts/test-native-issue-key-resume.py

      - name: Restore write access to the uv fixture cache
        if: always()
        run: if [ -d "$RUNNER_TEMP/native-target-uv-cache" ]; then chmod -R u+w "$RUNNER_TEMP/native-target-uv-cache"; fi

  # Go static analysis: build hygiene, lint, and the callgraph/complexity
  # planes. Cached module and build caches keep the pinned analysis tools
  # from being recompiled on every run.
  verify-go:
    name: verify-go
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Check Go formatting
        run: unformatted="$(gofmt -l .)" || exit 1; printf '%s\n' "$unformatted"; test -z "$unformatted"
      - name: Tidy Go modules
        run: go mod tidy
      - name: Check module diff
        run: git diff --exit-code
      - name: Vet
        run: go vet ./...
      # The next two steps keep exact parity with the pre-push preflight
      # gates (CON-893): each lefthook.yml command must stay identical to a
      # CI-owned command, and scripts/check-pre-push.py fails when either
      # side drifts. They also stand alone as the fast build and
      # compile-only checks of every test binary.
      - name: Build
        run: go build ./...
      - name: Compile all tests
        run: go test -run '^$' -timeout=15m ./...
      - name: Reject production event log references
        run: python3 scripts/go-test-results.py --output-dir "$RUNNER_TEMP/go-test-results/event-log" -- go test -count=1 -timeout=300s -run '^(TestEventLogReferences|TestEventLogReferencePropertiesBite)$' ./internal/store
      - name: Lint Go
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1 run --output.text.colors=false ./...
      - name: Validate product reachability
        run: python3 scripts/check-reachability.py
      - name: Validate cognitive-complexity budget
        run: python3 scripts/check-complexity.py
      - name: Test reachability, issue-state and complexity checkers
        run: python3 scripts/test-reachability.py && python3 scripts/test-update-issue-state.py && python3 scripts/test-complexity.py && python3 scripts/test-evidence-anchors.py
      - name: Retain native Go results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: go-test-results-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/go-test-results
          if-no-files-found: error
          retention-days: 90

  # Full suite without the race detector, split across runners.
  # internal/store and cmd/concord each run as shard jobs that
  # scripts/go-test-shard.py deals from `go test -list`. verify-tests-rest
  # runs every other package, and verify-tests keeps the required check name
  # by requiring verify-tests-rest and every shard job.
  #
  # Shard margin rule: over the last 50 successful runs of this workflow, the
  # 90th percentile of the slowest internal/store shard's test step stays
  # under 540 s, 60% of the 15m alarm each shard runs under. Add a shard when
  # that p90 passes 540 s or any one run passes 675 s (75%).
  # Whole Test shard steps include discovery/build before the producer starts;
  # command_wall_seconds alone does not measure this margin.
  # Measure it with:
  #
  #   gh run list --workflow ci.yml --status success --limit 50 --json databaseId --jq '.[].databaseId' |
  #     xargs -I{} gh run view {} --json jobs --jq '[.jobs[] | select(.name | startswith("verify-tests-store-")) | .steps[] | select(.name | startswith("Test shard")) | (.completedAt | fromdate) - (.startedAt | fromdate)] | max' |
  #     sort -n | awk '{v[NR]=$1} END {i=int(NR*0.9); if (i < NR*0.9) i++; print "p90", v[i], "max", v[NR]}'
  verify-tests:
    name: verify-tests
    needs: [verify-tests-rest, verify-tests-store-1, verify-tests-store-2, verify-tests-store-3, verify-tests-store-4, verify-tests-store-5, verify-tests-store-6, verify-tests-store-7, verify-tests-cli-1, verify-tests-cli-2]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every test shard to pass
        env:
          REST_RESULT: ${{ needs.verify-tests-rest.result }}
          STORE_1_RESULT: ${{ needs.verify-tests-store-1.result }}
          STORE_2_RESULT: ${{ needs.verify-tests-store-2.result }}
          STORE_3_RESULT: ${{ needs.verify-tests-store-3.result }}
          STORE_4_RESULT: ${{ needs.verify-tests-store-4.result }}
