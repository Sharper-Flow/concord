name: PR title

# The repository merges by squash with squash_merge_commit_title=PR_TITLE, so
# this title becomes the commit subject on main verbatim, and scripts/release.py
# computes the next version from those subjects. A title outside the
# Conventional Commit grammar releases nothing and says nothing, without
# failing. This check makes that consequence visible before the merge.
#
# The merge_group trigger runs the same guard when the pull request enters the
# merge queue. The queue builds the squashed commit before the merge, and that
# commit's subject is the exact subject that lands on main, whatever a later
# rename does to the pull-request title. The queue head is validated with the
# same grammar and byte budget, minus the reference GitHub appended.

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

jobs:
  title:
    name: title
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate pull-request title as a release subject
        if: github.event_name == 'pull_request'
        env:
          COMMIT_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/check-commit-title.py
      - name: Validate the merge-queue head subject as a release subject
        if: github.event_name == 'merge_group'
        run: python3 scripts/check-commit-title.py --landed-subject "$(git log -1 --format=%s)"
