name: Nightly

# The per-branch CI races the store — the concurrency-bearing surface — on
# every run. The full-tree race suite and the vulnerability scan change their
# answers slowly, so they run on a schedule against main instead of costing
# every pull request and every merge-group verification.

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly:
    name: full-race-and-vulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Download Go modules
        run: go mod download all
      - name: Fetch released source pairs
        run: |
          git fetch --no-tags --depth=1 origin +refs/tags/v11.61.0:refs/tags/v11.61.0
          git fetch --no-tags --depth=1 origin +refs/tags/v11.63.30:refs/tags/v11.63.30
          git fetch --no-tags --depth=1 origin +refs/tags/v13.4.0:refs/tags/v13.4.0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: 0.11.26
          enable-cache: "false"
      - name: Provision the committed adapter recipe Python
        # The full-tree run includes the recipe test. Install its exact pin
        # before the offline test phase.
        run: |
          version="$(python3 -c 'import json; print(json.load(open(".concord/oracles/adapter/native-acceptance.v1.json"))["pin"]["python"])')"
          uv python install --no-bin "$version"
          python_path="$(uv python find --managed-python "$version")"
          python_dir="$(dirname "$python_path")"
          test "$("$python_dir/python3" --version)" = "Python $version"
          printf '%s\n' "$python_dir" >> "$GITHUB_PATH"
      - name: Warm the uv fixture cache from the committed lock
        # The package-network step. Both commands refuse a lock that no
        # longer matches its project, and the sync checks every wheel
        # against the lock's hashes. The store tests copy this cache into
        # private scratch and run uv offline, so the cache is made read-only.
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/native-target-uv-cache
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/native-target-uv-venv
          UV_PYTHON_DOWNLOADS: never
        run: |
          uv lock --no-config --locked --refresh --python python3 --project internal/store/testdata/native-target-uv
          uv sync --no-config --locked --no-build --python python3 --project internal/store/testdata/native-target-uv
          chmod -R a-w "$UV_CACHE_DIR"
      - name: Test every package under the race detector
        # internal/agent under -race runs at ~575-595s on 2-core runners.
        # The 30m timeout leaves headroom for routine growth.
        env:
          OC_NATIVE_UV_CACHE: ${{ runner.temp }}/native-target-uv-cache
          UV_OFFLINE: "1"
          UV_PYTHON_DOWNLOADS: never
        run: go test -race -timeout=30m ./...
      - name: Restore write access to the uv fixture cache
        if: always()
        run: if [ -d "$RUNNER_TEMP/native-target-uv-cache" ]; then chmod -R u+w "$RUNNER_TEMP/native-target-uv-cache"; fi
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
