name: Auto-update PR branches

on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: auto-update-prs
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'Sharper-Flow/concord'
    name: Update branches behind main and re-run skipped checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Update open pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          updated=0
          skipped=0
          failed=0

          if ! prs="$(gh pr list --repo Sharper-Flow/concord --state open --base main --limit 1000 --json number,isDraft,mergeStateStatus)"; then
            echo "Unable to list open pull requests" >&2
            exit 1
          fi

          while IFS= read -r pr; do
            number="$(jq -r '.number' <<<"$pr")"
            is_draft="$(jq -r '.isDraft' <<<"$pr")"
            merge_state="$(jq -r '.mergeStateStatus' <<<"$pr")"

            if [[ "$is_draft" == "true" || "$merge_state" != "BEHIND" ]]; then
              skipped=$((skipped + 1))
              continue
            fi

            if gh pr update-branch "$number" --repo Sharper-Flow/concord; then
              updated=$((updated + 1))
            else
              printf 'Failed to update PR #%s\n' "$number" >&2
              failed=$((failed + 1))
            fi
          done < <(jq -c '.[]' <<<"$prs")

          printf 'Auto-update summary: updated %d, skipped %d, failed %d\n' "$updated" "$skipped" "$failed"

      # A push made with GITHUB_TOKEN never triggers workflow runs (the
      # recursion guard): the runs are created and concluded action_required
      # without executing, which blocks the required checks on the new head.
      # Re-running those runs executes them. This heals both the merge
      # commits this workflow just created and any left stuck by earlier
      # sweeps (#289).
      - name: Re-run checks skipped by the GITHUB_TOKEN recursion guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          reran=0

          while IFS= read -r number; do
            head_sha="$(gh pr view "$number" --repo Sharper-Flow/concord --json headRefOid --jq '.headRefOid')"
            [[ -n "$head_sha" ]] || continue

            while IFS= read -r run_id; do
              [[ -n "$run_id" ]] || continue
              if gh api --method POST "repos/Sharper-Flow/concord/actions/runs/$run_id/rerun" >/dev/null 2>&1; then
                printf 'Re-run scheduled for PR #%s run %s\n' "$number" "$run_id"
                reran=$((reran + 1))
              else
                printf 'Re-run failed for PR #%s run %s\n' "$number" "$run_id" >&2
              fi
            done < <(gh api "repos/Sharper-Flow/concord/actions/runs?head_sha=$head_sha&per_page=50" \
              | jq -r '.workflow_runs[] | select(.conclusion == "action_required") | .id')

          done < <(gh pr list --repo Sharper-Flow/concord --state open --base main --limit 1000 --json number --jq '.[].number')

          printf 'Rerun summary: %d run(s) scheduled\n' "$reran"
