name: Auto-update PR branches

on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: auto-update-prs
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'Sharper-Flow/concord'
    name: Update branches behind main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Nothing here uses GITHUB_TOKEN. Updating a branch with it produces a
    # pull_request run in an approval-required state that never executes, so
    # `verify` cannot report and a strict-mode branch can never leave BLOCKED.
    # AUTO_UPDATE_TOKEN carries contents:write and pull-requests:write on this
    # repository only.
    permissions: {}
    steps:
      - name: Update open pull requests
        env:
          GH_TOKEN: ${{ secrets.AUTO_UPDATE_TOKEN }}
        run: |
          set -u

          if [[ -z "${GH_TOKEN}" ]]; then
            echo "AUTO_UPDATE_TOKEN is unset. Falling back to GITHUB_TOKEN would update" >&2
            echo "branches into a state where the required checks never run, which is worse" >&2
            echo "than leaving them behind. Refusing to continue." >&2
            exit 1
          fi

          updated=0
          skipped=0
          failed=0

          if ! prs="$(gh pr list --repo Sharper-Flow/concord --state open --base main --limit 1000 --json number,isDraft,mergeStateStatus)"; then
            echo "Unable to list open pull requests" >&2
            exit 1
          fi

          while IFS= read -r pr; do
            number="$(jq -r '.number' <<<"$pr")"
            is_draft="$(jq -r '.isDraft' <<<"$pr")"
            merge_state="$(jq -r '.mergeStateStatus' <<<"$pr")"

            if [[ "$is_draft" == "true" || "$merge_state" != "BEHIND" ]]; then
              skipped=$((skipped + 1))
              continue
            fi

            if gh pr update-branch "$number" --repo Sharper-Flow/concord; then
              updated=$((updated + 1))
            else
              printf 'Failed to update PR #%s\n' "$number" >&2
              failed=$((failed + 1))
            fi
          done < <(jq -c '.[]' <<<"$prs")

          printf 'Auto-update summary: updated %d, skipped %d, failed %d\n' "$updated" "$skipped" "$failed"
