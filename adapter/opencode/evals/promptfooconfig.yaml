# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
#
# CD-0017 D7 lane behavioural evals. Advisory only: this harness never
# completes a gate and never substitutes for the deterministic Go tests that
# hold registry, packet, dispatch, and evidence authority.
#
# Run:      npx promptfoo@0.122.0 eval -c adapter/opencode/evals/promptfooconfig.yaml
# Validate: npx promptfoo@0.122.0 validate config -c adapter/opencode/evals/promptfooconfig.yaml

description: Concord lane behavioural evals (CD-0017 D7, advisory)

prompts:
  - id: file://packets/research-bounded-question.json
    label: research/bounded-question
  - id: file://packets/research-refuses-nested-dispatch.json
    label: research/refuses-nested-dispatch
  - id: file://packets/implement-bounded-task.json
    label: implement/bounded-task
  - id: file://packets/implement-refuses-workflow-authority.json
    label: implement/refuses-workflow-authority
  - id: file://packets/design-bounded-task.json
    label: design/bounded-task
  - id: file://packets/design-refuses-workflow-authority.json
    label: design/refuses-workflow-authority
  - id: file://packets/review-bounded-review.json
    label: review/bounded-review
  - id: file://packets/review-refuses-self-acceptance.json
    label: review/refuses-self-acceptance
  - id: file://packets/review-seeded-scope-violation.json
    label: review/seeded-scope-violation
  - id: file://packets/review-seeded-evidence-gap.json
    label: review/seeded-evidence-gap
  - id: file://packets/review-seeded-validator-weakening.json
    label: review/seeded-validator-weakening
  - id: file://packets/verify-deterministic-evidence.json
    label: verify/deterministic-evidence
  - id: file://packets/verify-refuses-repair.json
    label: verify/refuses-repair

providers:
  - id: 'exec: opencode run --agent concord-research --format json'
    label: lane-research
    prompts:
      - 'research/*'
  - id: 'exec: opencode run --agent concord-implement --format json'
    label: lane-implement
    prompts:
      - 'implement/*'
  - id: 'exec: opencode run --agent concord-design --format json'
    label: lane-design
    prompts:
      - 'design/*'
  - id: 'exec: opencode run --agent concord-review --format json'
    label: lane-review
    prompts:
      - 'review/*'
  - id: 'exec: opencode run --agent concord-verify --format json'
    label: lane-verify
    prompts:
      - 'verify/*'

# Every lane answers to the same report contract, so the assertion is shared
# and fully deterministic (issue #212): it parses the host event stream
# exactly as adapter/opencode/dispatch.ts does, validates
# agent-lane-report.v1, binds the report to its packet, refuses task
# delegation, and holds seeded-defect packets to their marker contracts.
# No external grading API runs here — a baseline must reproduce on the host
# that records it.
defaultTest:
  assert:
    - type: javascript
      value: file://assertions/lane-report.js
