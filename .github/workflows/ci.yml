name: CI

on:
  pull_request:
  # A merge queue validates each pull request against the latest main plus the
  # entries ahead of it, on a temporary `gh-readonly-queue/**` ref. The
  # verify* checks below are required, and a merge group that never reports
  # one cannot merge, so this trigger is what lets the queue replace the
  # up-to-date requirement. The jobs run in parallel; wall time is the
  # slowest job, not the sum of every step.
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Validators and the Python script battery. No Go compilation here: the
  # Go-dependent analysis checks live in verify-go.
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Validate public content
        run: python3 scripts/check-public-content.py
      - name: Validate documentation links
        run: python3 scripts/check-doc-links.py
      - name: Validate agent instructions
        run: python3 scripts/check-agents-md.py
      - name: Validate predecessor independence
        run: python3 scripts/check-predecessor-independence.py
      - name: Test predecessor independence
        run: python3 scripts/test-predecessor-independence.py
      - name: Test predecessor harvest
        run: python3 scripts/test-predecessor-harvest.py
      - name: Validate script test coverage
        run: python3 scripts/check-script-tests.py
      - name: Validate CD allocation
        run: |
          git fetch origin main --quiet
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --quiet
          python3 scripts/check-cd-allocation.py --no-fetch
      - name: Validate JSON
        run: python3 scripts/check-json.py
      - name: Validate project tooling manifest
        run: python3 scripts/check-project-tooling.py
      - name: Validate durable tier
        run: python3 scripts/check-durable-tier.py
      - name: Validate predecessor operational coverage
        run: python3 scripts/check-predecessor-coverage.py
      - name: Validate agent tool-surface contracts
        env:
          CONCORD_REQUIRE_BUN: "1"
        run: python3 scripts/check-agent-contracts.py
      - name: Validate relation vocabulary
        run: python3 scripts/check-relation-vocabulary.py
      - name: Validate storage vocabulary authority
        run: python3 scripts/check-vocabulary-authority.py
      - name: Check vocabulary generators
        run: python3 scripts/generate-work-kinds.py --check && python3 scripts/generate-native-run-statuses.py --check && python3 scripts/generate-relation-vocabulary.py --check && python3 scripts/generate-durable-tier-budget.py --check
      - name: Validate work-item and native-run vocabularies
        run: python3 scripts/check-work-kinds.py && python3 scripts/check-native-run-statuses.py
      - name: Validate archived-work knowledge-kind vocabulary
        run: python3 scripts/check-archived-work-kind.py
      - name: Validate rigor-class vocabulary
        run: python3 scripts/check-rigor-class.py
      - name: Validate approval consequence vocabulary
        run: python3 scripts/check-approval-consequence.py
      - name: Test release and installer tooling
        run: python3 scripts/test-release.py && python3 scripts/test-installer.py && python3 scripts/test-commit-title.py && python3 scripts/test-predecessor-coverage.py && python3 scripts/test-floor-readiness.py && python3 scripts/test-knowledge-index.py && python3 scripts/test-knowledge-vocabulary.py && python3 scripts/test-knowledge-closure.py && python3 scripts/test-relation-vocabulary.py && python3 scripts/test-vocabulary-authority.py && python3 scripts/test-work-kinds.py && python3 scripts/test-native-run-statuses.py && python3 scripts/test-rigor-class.py && python3 scripts/test-approval-consequence.py && python3 scripts/test-archived-work-kind.py && python3 scripts/test-doc-contract.py && python3 scripts/test-agents-md.py && python3 scripts/test-agent-contracts.py && python3 scripts/test-generate-law-coverage.py && python3 scripts/test-generate-knowledge-index.py && python3 scripts/test-generate-agent-lanes.py && python3 scripts/test-shard-format.py && python3 scripts/test-law-coverage.py && python3 scripts/test-cd-allocation.py && python3 scripts/test-renumber-cd.py && python3 scripts/test-script-tests.py && python3 scripts/test-project-tooling.py && python3 scripts/test-durable-tier.py && python3 scripts/test-lane-eval-baseline.py

  # Go static analysis: build hygiene, lint, and the callgraph/complexity
  # planes. Cached module and build caches keep the pinned analysis tools
  # from being recompiled on every run.
  verify-go:
    name: verify-go
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Download Go modules
        # `all` scope, not the default: the dependency-inventory generator
        # resolves the full build list offline, including module-graph-only
        # modules that building the main module never fetches.
        run: go mod download all
      - name: Restore Go build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-build-${{ runner.os }}-
      - name: Check Go formatting
        run: test -z "$(gofmt -l .)"
      - name: Tidy Go modules
        run: go mod tidy
      - name: Check module diff
        run: git diff --exit-code
      - name: Vet
        run: go vet ./...
      - name: Lint Go
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1 run --output.text.colors=false ./...
      - name: Validate product reachability
        run: python3 scripts/check-reachability.py
      - name: Validate cognitive-complexity budget
        run: python3 scripts/check-complexity.py
      - name: Check dependency inventory generator
        run: python3 scripts/generate-dependency-inventory.py --check
      - name: Test reachability and complexity checkers
        run: python3 scripts/test-reachability.py && python3 scripts/test-complexity.py && python3 scripts/test-evidence-anchors.py && python3 scripts/test-generate-dependency-inventory.py

  # Full suite without the race detector.
  verify-tests:
    name: verify-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Restore Go build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-build-${{ runner.os }}-
      - name: Test all packages
        run: go test -timeout=15m ./...

  # Race detector on store tests that coordinate concurrent Go callers.
  # SQLite lock-wait tests coordinate through database locks and channels rather
  # than unsynchronized mutable Go state. The ordinary suite covers them without
  # multiplying fixed lock delays. The full tree races in the nightly workflow.
  verify-race:
    name: verify-race
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Restore Go build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-build-${{ runner.os }}-
      - name: Test concurrent store access under the race detector
        run: >-
          go test -race -timeout=15m -run
          '^(TestOpenConcurrentlyInitializesOneDatabase|TestAppendEventConcurrentEquivalentAppends|TestAppendEventConcurrentDivergentAppends|TestConcurrentWorkflowActorAppendsUseTheSingleWriter|TestWorkflowLawRevisionCutoverCommitsBeforeCrossConnectionAcceptance)$'
          ./internal/store

  # Production-like acceptance: the ten-process conformance run and the
  # packaged black-box suite.
  verify-acceptance:
    name: verify-acceptance
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Restore Go build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-build-${{ runner.os }}-
      - name: Run production-like ten-process acceptance conformance
        env:
          CONCORD_CONFORMANCE_LONG: "1"
          CONCORD_ACCEPTANCE_RUNNER: "1"
        run: go test -count=1 -run '^TestTenProcessAcceptanceConformance$' -v ./internal/store
      - name: Run packaged black-box acceptance
        run: python3 scripts/test-blackbox-acceptance.py
