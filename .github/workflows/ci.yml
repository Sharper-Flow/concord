  # Race detector on store tests that coordinate concurrent Go callers.
  # SQLite lock-wait tests coordinate through database locks and channels rather
  # than unsynchronized mutable Go state. The ordinary suite covers them without
  # multiplying fixed lock delays. The full tree races in the nightly workflow.
  verify-race:
    name: verify-race
    needs: [verify-upstream-compatibility]
    runs-on: ubuntu-24.04
    env:
      OC_NATIVE_ISOLATION_REQUIRED: "1"
      CONCORD_UPSTREAM_BWRAP_SHA256: ${{ needs.verify-upstream-compatibility.outputs.bwrap-sha256 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Set up native Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.15.0
          architecture: x64
          check-latest: false
          package-manager-cache: false
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: 0.11.26
          enable-cache: "false"
      - name: Initialize native scratch paths
        run: |
          printf 'OC_NATIVE_NPM_CACHE=%s/native-target-npm-cache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'OC_NATIVE_ISOLATION_EVIDENCE=%s/native-isolation-evidence\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Provision fixed native isolation on this disposable runner
        env:
          CONCORD_DISPOSABLE_CI_PROVISION: "1"
        run: bash scripts/ci-provision-native-isolation.sh
      - name: Retain installed isolation and compatibility digest evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-isolation-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-isolation-evidence
          if-no-files-found: error
          retention-days: 90
      - name: Warm every public native fixture npm archive
        run: bun scripts/ci-warm-native-npm.ts
      - name: Warm the uv fixture cache from the committed lock
        # The only networked uv step. Both commands refuse a lock that no
        # longer matches its project, and the sync checks every wheel
        # against the lock's hashes. The store tests copy this cache into
        # private scratch and run uv offline, so the cache is made read-only.
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/native-target-uv-cache
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/native-target-uv-venv
          UV_PYTHON_DOWNLOADS: never
        run: |
          uv lock --no-config --locked --refresh --python python3 --project internal/store/testdata/native-target-uv
          uv sync --no-config --locked --no-build --python python3 --project internal/store/testdata/native-target-uv
          chmod -R a-w "$UV_CACHE_DIR"
      - name: Test concurrent store access under the race detector
        env:
          CONCORD_SELECTED_PRODUCT_ID: poison-product
          CONCORD_SELECTED_WORK_ID: poison-work
          CONCORD_PRODUCT_ID: poison-product
          CONCORD_DB_PATH: /nonexistent/poison.db
          CONCORD_SELECTED_PROJECT_ID: poison-project
          CONCORD_HOST_INSTRUCTIONS: /nonexistent/poison-instructions
          CONCORD_CLIENT_REF: poison-client
          CONCORD_SOURCE: /nonexistent/poison-source
          CONCORD_BIN: /nonexistent/poison-concord
          CONCORD_FUTURE_INPUT: poison-future
          CONCORD_TEST_SUBPROCESS: poison-no-bypass
          OC_NATIVE_UV_CACHE: ${{ runner.temp }}/native-target-uv-cache
          UV_OFFLINE: "1"
          UV_PYTHON_DOWNLOADS: never
        run: >-
          python3 scripts/go-test-results.py --output-dir "$RUNNER_TEMP/go-test-results/tests" -- go test -race -timeout=15m -run
          '^(TestOpenConcurrentlyInitializesOneDatabase|TestAppendEventConcurrentEquivalentAppends|TestAppendEventConcurrentDivergentAppends|TestConcurrentWorkflowActorAppendsUseTheSingleWriter|TestWorkflowLawRevisionCutoverCommitsBeforeCrossConnectionAcceptance)$'
          ./internal/store
      - name: Retain native Go results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: go-test-results-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/go-test-results
          if-no-files-found: error
          retention-days: 90
      - name: Restore write access to the uv fixture cache
        if: always()
        run: if [ -d "$RUNNER_TEMP/native-target-uv-cache" ]; then chmod -R u+w "$RUNNER_TEMP/native-target-uv-cache"; fi

  # Production-like acceptance: the ten-process conformance run and the
  # packaged black-box suite.
  verify-acceptance:
    name: verify-acceptance
    needs: [verify-upstream-compatibility]
    runs-on: ubuntu-24.04
    env:
      OC_NATIVE_ISOLATION_REQUIRED: "1"
      CONCORD_UPSTREAM_BWRAP_SHA256: ${{ needs.verify-upstream-compatibility.outputs.bwrap-sha256 }}
    steps:
