name: CI

on:
  pull_request:
  # A merge queue validates each pull request against the latest main plus the
  # entries ahead of it, on a temporary `gh-readonly-queue/**` ref. `verify` is
  # a required check, and a merge group that never reports one cannot merge, so
  # this trigger is what lets the queue replace the up-to-date requirement.
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Validate public content
        run: python3 scripts/check-public-content.py
      - name: Validate documentation links
        run: python3 scripts/check-doc-links.py
      - name: Validate agent instructions
        run: python3 scripts/check-agents-md.py
      - name: Validate script test coverage
        run: python3 scripts/check-script-tests.py
      - name: Validate CD allocation
        run: |
          git fetch origin main --quiet
          python3 scripts/check-cd-allocation.py --no-fetch
      - name: Validate JSON
        run: python3 scripts/check-json.py
      - name: Validate predecessor operational coverage
        run: python3 scripts/check-predecessor-coverage.py
      - name: Validate agent tool-surface contracts
        env:
          CONCORD_REQUIRE_BUN: "1"
        run: python3 scripts/check-agent-contracts.py
      - name: Test release and installer tooling
        run: python3 scripts/test-release.py && python3 scripts/test-installer.py && python3 scripts/test-commit-title.py && python3 scripts/test-predecessor-coverage.py && python3 scripts/test-floor-readiness.py && python3 scripts/test-knowledge-index.py && python3 scripts/test-knowledge-vocabulary.py && python3 scripts/test-knowledge-closure.py && python3 scripts/test-doc-contract.py && python3 scripts/test-agents-md.py && python3 scripts/test-agent-contracts.py && python3 scripts/test-generate-law-coverage.py && python3 scripts/test-generate-knowledge-index.py && python3 scripts/test-generate-agent-lanes.py && python3 scripts/test-shard-format.py && python3 scripts/test-law-coverage.py && python3 scripts/test-reachability.py && python3 scripts/test-complexity.py && python3 scripts/test-cd-allocation.py && python3 scripts/test-renumber-cd.py && python3 scripts/test-script-tests.py
      - name: Check Go formatting
        run: test -z "$(gofmt -l .)"
      - name: Tidy Go modules
        run: go mod tidy
      - name: Check module diff
        run: git diff --exit-code
      - name: Vet
        run: go vet ./...
      - name: Validate product reachability
        run: python3 scripts/check-reachability.py
      - name: Validate cognitive-complexity budget
        run: python3 scripts/check-complexity.py
      - name: Test with race detector
        # internal/agent under -race runs at ~575-595s on 2-core runners —
        # 96-99% of the 10m default. The suite outgrew the default timeout;
        # raise it rather than let routine growth flake every branch.
        run: go test -race -timeout=20m ./...
      - name: Run production-like ten-process acceptance conformance
        env:
          CONCORD_CONFORMANCE_LONG: "1"
          CONCORD_ACCEPTANCE_RUNNER: "1"
        run: go test -count=1 -run '^TestTenProcessAcceptanceConformance$' -v ./internal/store
      - name: Run packaged black-box acceptance
        run: python3 scripts/test-blackbox-acceptance.py
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
